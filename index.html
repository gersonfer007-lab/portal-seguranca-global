<style>html{background:#0a0e1a}</style>
<style>
:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #111827;
  --bg-card: #1a2235;
  --bg-card-hover: #1f2a40;
  --border: #2a3550;
  --text-primary: #e8ecf4;
  --text-secondary: #8b95a8;
  --text-muted: #5a6478;
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,.25);
  --green: #22c55e;
  --green-glow: rgba(34,197,94,.2);
  --yellow: #eab308;
  --yellow-glow: rgba(234,179,8,.2);
  --red: #ef4444;
  --red-glow: rgba(239,68,68,.2);
  --orange: #f97316;
  --gradient-accent: linear-gradient(135deg, #3b82f6, #6366f1);
  --gradient-danger: linear-gradient(135deg, #ef4444, #f97316);
  --gradient-safe: linear-gradient(135deg, #22c55e, #10b981);
  --shadow: 0 4px 24px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,.5);
  --radius: 12px;
  --radius-lg: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; -webkit-font-smoothing: antialiased; position: relative; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* HEADER */
.header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px);
}
.header-brand {
  display: flex; align-items: center; gap: 12px;
  font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em;
}
.header-brand .icon {
  width: 36px; height: 36px; background: var(--gradient-accent);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; box-shadow: 0 0 20px var(--accent-glow);
}
.header-badge {
  background: var(--accent); color: #fff; font-size: .65rem; font-weight: 700;
  padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: .08em;
}
.header-status {
  display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--text-secondary);
}
.header-status .dot {
  width: 8px; height: 8px; background: var(--green); border-radius: 50%;
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:.4; } }

/* BRASAO / EMBLEM */
.emblem-section {
  display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 0;
  background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-secondary) 100%);
  position: relative; overflow: hidden;
}

/* FLAGS LATERAIS — acompanham toda a altura da pagina */
.flags-column {
  position: absolute; top: 0; display: flex; flex-direction: column; gap: 4px;
  padding: 8px 0; z-index: 900;
  min-height: 100%;
}
.flags-column.left { left: 4px; }
.flags-column.right { right: 4px; }
.flag-item {
  display: flex; align-items: center; gap: 4px;
  cursor: pointer; position: relative; transition: transform .2s, box-shadow .25s;
  padding: 1px 3px; border-radius: 4px;
}
.flag-item:hover { transform: scale(1.15); z-index: 10; background: rgba(59,130,246,.15); }
.flag-item.flag-active { background: rgba(59,130,246,.25); box-shadow: 0 0 8px rgba(59,130,246,.5); transform: scale(1.12); }
.flag-item img {
  width: 26px; height: 17px; object-fit: cover; display: block;
  border-radius: 2px; box-shadow: 0 1px 4px rgba(0,0,0,.4); flex-shrink: 0;
}
.flag-name {
  font-size: .45rem; color: var(--text-secondary); white-space: nowrap;
  font-weight: 500; letter-spacing: .02em; line-height: 1;
}
.flags-column.left .flag-name { text-align: left; }
.flags-column.right { align-items: flex-end; }
.flags-column.right .flag-item { flex-direction: row-reverse; }
.flags-column.right .flag-name { text-align: right; }
/* Logo ONU nas bandeiras */
.flag-un-logo {
  display: flex; align-items: center; justify-content: center;
  padding: 6px 0; margin: 4px 0;
}
.flag-un-logo img {
  width: 36px; height: 36px; object-fit: contain; display: block;
  filter: drop-shadow(0 0 6px rgba(0,157,255,.4));
  border-radius: 0; box-shadow: none;
}
@media (max-width: 420px) {
  .flag-item img { width: 20px; height: 14px; }
  .flag-name { font-size: .38rem; }
  .flags-column { gap: 2px; padding: 4px 0; }
  .flags-column.left { left: 1px; }
  .flags-column.right { right: 1px; }
  .flag-un-logo img { width: 28px; height: 28px; }
}
/* MOBILE: esconder bandeiras laterais e liberar conteudo */
@media (max-width: 768px) {
  .flags-column { display: none !important; }
}
/* Seletor de idioma compacto para mobile */
.mobile-lang-bar {
  display: none; background: rgba(10,14,26,.95); border-bottom: 1px solid rgba(255,255,255,.08);
  padding: 6px 10px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; gap: 6px;
}
.mobile-lang-bar::-webkit-scrollbar { display: none; }
.mobile-lang-bar .mlb-flag {
  display: inline-flex; align-items: center; gap: 3px; padding: 4px 8px; border-radius: 6px;
  cursor: pointer; border: 1px solid transparent; transition: all .2s; flex-shrink: 0;
}
.mobile-lang-bar .mlb-flag:hover, .mobile-lang-bar .mlb-flag.active {
  background: rgba(59,130,246,.2); border-color: rgba(59,130,246,.4);
}
.mobile-lang-bar .mlb-flag img { width: 22px; height: 15px; border-radius: 2px; }
.mobile-lang-bar .mlb-flag span { font-size: .65rem; color: #ccc; }
@media (max-width: 768px) {
  .mobile-lang-bar { display: flex; }
}
.emblem-img {
  width: 160px; height: auto;
  filter: drop-shadow(0 0 30px rgba(59,130,246,.3)) drop-shadow(0 4px 20px rgba(0,0,0,.5));
  animation: emblem-float 4s ease-in-out infinite;
  transition: transform .3s;
}
.emblem-img:hover { transform: scale(1.08); }
@keyframes emblem-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.emblem-title {
  font-size: 1.1rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase;
  margin-top: .8rem; color: var(--text-primary);
  text-shadow: 0 0 20px var(--accent-glow);
  text-align: center; width: 100%; padding: 0 1rem; box-sizing: border-box;
  word-wrap: break-word; line-height: 1.4;
}
.emblem-tagline {
  font-size: .88rem; font-weight: 600; color: var(--accent);
  letter-spacing: .04em; margin-top: .5rem; text-align: center;
  width: 100%; padding: 0 1rem; box-sizing: border-box;
  text-shadow: 0 0 14px var(--accent-glow); line-height: 1.4;
}
.emblem-subtitle {
  font-size: .72rem; color: var(--text-secondary); letter-spacing: .3em; text-transform: uppercase;
  margin-top: .3rem; font-weight: 500;
}
.emblem-divider {
  width: 120px; height: 2px; margin-top: 1rem;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

/* MODAL DE TERMOS */
.terms-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
  background: rgba(0,0,0,.85); backdrop-filter: blur(12px);
  display: none; align-items: center; justify-content: center;
  padding: 1rem; opacity: 0; transition: opacity .4s;
}
.terms-overlay.active { display: flex; opacity: 1; }
.terms-overlay.hidden { opacity: 0; pointer-events: none; }
.terms-box {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
  max-width: 440px; width: 100%; padding: 2rem 1.5rem; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.6); max-height: 90vh; overflow-y: auto;
}
.terms-box .terms-emblem { width: 90px; margin-bottom: 1rem; filter: drop-shadow(0 0 20px rgba(59,130,246,.3)); }
.terms-box h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: .3rem; color: var(--text-primary); }
.terms-box .terms-sub { font-size: .7rem; color: var(--accent); letter-spacing: .2em; text-transform: uppercase; margin-bottom: 1.2rem; }
.terms-box .terms-text {
  text-align: left; font-size: .75rem; color: var(--text-secondary); line-height: 1.6;
  background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 10px;
  padding: 1rem; margin-bottom: 1rem; max-height: 220px; overflow-y: auto;
}
.terms-box .terms-text strong { color: var(--text-primary); }
.terms-box .terms-text ul { margin: .5rem 0; padding-left: 1.2rem; }
.terms-box .terms-text li { margin-bottom: .4rem; }
.terms-check {
  display: flex; align-items: flex-start; gap: 8px; margin-bottom: 1.2rem;
  text-align: left; font-size: .72rem; color: var(--text-secondary); cursor: pointer;
}
.terms-check input[type="checkbox"] {
  width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px;
  accent-color: var(--accent); cursor: pointer;
}
.terms-btn {
  width: 100%; padding: 12px; font-size: .85rem; font-weight: 700; border: none; border-radius: 10px;
  cursor: pointer; transition: all .3s; text-transform: uppercase; letter-spacing: .1em;
}
.terms-btn.disabled {
  background: rgba(255,255,255,.08); color: rgba(255,255,255,.25); cursor: not-allowed;
}
.terms-btn.enabled {
  background: var(--accent); color: #fff; box-shadow: 0 4px 20px var(--accent-glow);
}
.terms-btn.enabled:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--accent-glow); }

/* SEARCH SECTION */
.search-section {
  background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
  padding: 3rem 2rem 2rem;
  text-align: center;
}
.search-title {
  font-size: 2rem; font-weight: 800; letter-spacing: -.03em;
  background: linear-gradient(135deg, #e8ecf4, #8b95a8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: .5rem;
}
.search-subtitle {
  color: var(--text-secondary); font-size: .95rem; margin-bottom: 2rem;
}
.search-box {
  max-width: 640px; margin: 0 auto;
  display: flex; gap: 0;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: var(--shadow), 0 0 0 1px rgba(59,130,246,.1);
  transition: box-shadow .3s;
}
.search-box:focus-within {
  box-shadow: var(--shadow-lg), 0 0 0 2px var(--accent), 0 0 40px var(--accent-glow);
}
.search-box input {
  flex: 1; padding: 1rem 1.5rem; background: none; border: none; outline: none;
  color: var(--text-primary); font-size: 1rem; font-family: inherit;
}
.search-box input::placeholder { color: var(--text-muted); }
.search-box button {
  padding: 1rem 2rem; background: var(--gradient-accent); border: none;
  color: #fff; font-weight: 700; font-size: .9rem; cursor: pointer;
  display: flex; align-items: center; gap: 8px; transition: opacity .2s;
  font-family: inherit;
}
.search-box button:hover { opacity: .9; }
.search-box button:disabled { opacity: .5; cursor: not-allowed; }
.search-hint {
  margin-top: 1rem; font-size: .78rem; color: var(--text-muted);
}
.search-hint kbd {
  background: var(--bg-card); border: 1px solid var(--border);
  padding: 1px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace;
  font-size: .72rem;
}

/* ============================================================
   PESQUISAR PELO MAPA — botoes na area de busca
   ============================================================ */
.search-divider {
  display: flex; align-items: center; gap: 12px;
  max-width: 560px; margin: 1.4rem auto .9rem;
  color: var(--text-muted); font-size: .74rem;
  text-transform: uppercase; letter-spacing: .12em;
}
.search-divider::before, .search-divider::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}
.map-search-actions {
  display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
  max-width: 560px; margin: 0 auto;
}
.btn-map-search, .btn-gps-search {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 20px; border-radius: 11px; cursor: pointer;
  font-family: inherit; font-size: .88rem; font-weight: 600;
  transition: transform .15s, box-shadow .2s, background .2s, border-color .2s;
}
.btn-map-search {
  background: var(--gradient-accent); color: #fff;
  border: 1px solid rgba(99,102,241,.5);
  box-shadow: 0 4px 16px rgba(59,130,246,.28);
}
.btn-map-search:hover {
  transform: translateY(-2px); box-shadow: 0 7px 22px rgba(59,130,246,.42);
}
.btn-gps-search {
  background: var(--bg-card); color: var(--text-primary);
  border: 1px solid var(--border);
}
.btn-gps-search:hover {
  background: var(--bg-card-hover); border-color: var(--accent);
  transform: translateY(-2px);
}
.btn-map-search svg, .btn-gps-search svg { flex-shrink: 0; }

/* ============================================================
   MODAL — SELECIONAR LOCAL NO MAPA
   ============================================================ */
.mapsel-overlay {
  display: none; position: fixed; inset: 0; z-index: 2600;
  background: rgba(4,7,15,.86); backdrop-filter: blur(5px);
  align-items: center; justify-content: center; padding: 20px;
  opacity: 0; transition: opacity .25s;
}
.mapsel-overlay.active { opacity: 1; }
.mapsel-box {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 18px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 780px; max-height: 92vh;
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(14px) scale(.985); transition: transform .28s;
}
.mapsel-overlay.active .mapsel-box { transform: translateY(0) scale(1); }

.mapsel-head {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 18px 20px 14px; border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(59,130,246,.09), transparent);
}
.mapsel-head-txt { flex: 1; min-width: 0; }
.mapsel-head h3 {
  font-size: 1.08rem; font-weight: 800; color: var(--text-primary);
  letter-spacing: -.01em; margin-bottom: 3px;
}
.mapsel-head p { font-size: .8rem; color: var(--text-secondary); line-height: 1.45; }
.mapsel-close {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 9px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 1.35rem; line-height: 1;
  cursor: pointer; transition: background .2s, color .2s;
}
.mapsel-close:hover { background: var(--red-glow); color: var(--red); }

.mapsel-searchrow {
  display: flex; gap: 8px; padding: 14px 20px 12px;
}
.mapsel-searchrow input {
  flex: 1; min-width: 0; padding: 11px 14px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text-primary);
  font-family: inherit; font-size: 16px; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.mapsel-searchrow input:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
}
.mapsel-searchrow input::placeholder { color: var(--text-muted); }
.mapsel-searchrow button {
  flex-shrink: 0; width: 44px; border-radius: 10px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-secondary); transition: background .2s, color .2s, border-color .2s;
}
.mapsel-searchrow button:hover {
  background: var(--accent); border-color: var(--accent); color: #fff;
}

.mapsel-mapwrap {
  position: relative; margin: 0 20px; border-radius: 12px;
  overflow: hidden; border: 1px solid var(--border);
  background: var(--bg-card);
}
#mapsel-map { width: 100%; height: 340px; cursor: crosshair; }
.mapsel-crosshair-hint {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: 12px; z-index: 500; pointer-events: none;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border-radius: 20px;
  background: rgba(10,14,26,.9); border: 1px solid var(--border);
  color: var(--text-secondary); font-size: .76rem; font-weight: 500;
  white-space: nowrap; transition: opacity .3s;
}
.mapsel-crosshair-hint.gone { opacity: 0; }

.mapsel-picked {
  display: flex; align-items: flex-start; gap: 11px;
  margin: 14px 20px 0; padding: 12px 14px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-left: 3px solid var(--text-muted); border-radius: 0 10px 10px 0;
  transition: border-left-color .25s;
}
.mapsel-picked.filled { border-left-color: var(--accent); }
.mapsel-picked-icon {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-glow); color: var(--accent);
}
.mapsel-picked-body { flex: 1; min-width: 0; }
.mapsel-picked-label {
  display: block; font-size: .68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--text-muted); margin-bottom: 3px;
}
.mapsel-picked-addr {
  font-size: .84rem; color: var(--text-primary); line-height: 1.45;
  font-weight: 500; word-break: break-word;
}
.mapsel-picked-coords {
  display: block; margin-top: 4px; font-size: .7rem;
  font-family: 'JetBrains Mono', monospace; color: var(--text-muted);
}

.mapsel-foot {
  display: flex; gap: 10px; padding: 16px 20px 18px;
}
.mapsel-btn-cancel, .mapsel-btn-go {
  padding: 13px 18px; border-radius: 11px; cursor: pointer;
  font-family: inherit; font-size: .88rem; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity .2s, transform .15s, box-shadow .2s;
}
.mapsel-btn-cancel {
  flex-shrink: 0; background: var(--bg-card); color: var(--text-secondary);
  border: 1px solid var(--border);
}
.mapsel-btn-cancel:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.mapsel-btn-go {
  flex: 1; background: var(--gradient-accent); color: #fff;
  border: 1px solid rgba(99,102,241,.5);
  box-shadow: 0 4px 16px rgba(59,130,246,.28);
}
.mapsel-btn-go:hover:not(:disabled) {
  transform: translateY(-2px); box-shadow: 0 7px 22px rgba(59,130,246,.42);
}
.mapsel-btn-go:disabled {
  opacity: .45; cursor: not-allowed; box-shadow: none;
  background: var(--bg-card); border-color: var(--border); color: var(--text-muted);
}
/* Pino animado do local escolhido */
.mapsel-pin-pulse {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); border: 3px solid #fff;
  box-shadow: 0 0 0 rgba(59,130,246,.65);
  animation: mapselPulse 1.9s infinite;
}
@keyframes mapselPulse {
  0%   { box-shadow: 0 0 0 0 rgba(59,130,246,.6); }
  70%  { box-shadow: 0 0 0 16px rgba(59,130,246,0); }
  100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
}

/* MAIN LAYOUT */
.main-content {
  display: none; /* hidden until search */
  max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem 3rem;
}
.main-content.active { display: block; }

/* RESULT HEADER */
.result-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
}
.result-location h2 {
  font-size: 1.4rem; font-weight: 700; margin-bottom: .25rem;
}
.result-location p { color: var(--text-secondary); font-size: .85rem; }
.result-actions { display: flex; gap: .75rem; }
.btn {
  padding: .65rem 1.2rem; border-radius: var(--radius); font-size: .82rem;
  font-weight: 600; cursor: pointer; border: none; font-family: inherit;
  display: flex; align-items: center; gap: 6px; transition: all .2s;
}
.btn-primary { background: var(--gradient-accent); color: #fff; box-shadow: 0 0 20px var(--accent-glow); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 30px var(--accent-glow); }
.btn-outline { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--bg-card-hover); }

/* GRID */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 380px;
  grid-template-rows: auto auto auto;
  gap: 1.5rem;
}
@media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }

/* CARDS */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: var(--shadow);
}
.card-header {
  padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-header h3 {
  font-size: .85rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-secondary);
  display: flex; align-items: center; gap: 8px;
}
.card-header h3 .icon { font-size: 1rem; }
.card-body { padding: 1.25rem; }

/* MAP */
.map-card { grid-column: 1; grid-row: 1 / 3; }
#map { width: 100%; height: 480px; background: var(--bg-primary); border-radius: 0; }
#cesium-globe { width: 100%; height: 480px; background: var(--bg-primary); display: none; position: relative; overflow: hidden; }
#earth-iframe {
  width: 100%; height: 100%; border: none;
  filter: contrast(1.05) saturate(1.1);
}
.globe-loading {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-primary); color: var(--text-secondary);
  font-size: .85rem; z-index: 2; pointer-events: none; transition: opacity .5s;
}
.globe-loading.hidden { opacity: 0; pointer-events: none; }
.map-view-toggle {
  display: flex; gap: 4px; background: var(--bg-primary); border-radius: 8px; padding: 3px;
}
.map-view-toggle button {
  padding: 4px 10px; font-size: .7rem; border-radius: 6px; border: none;
  cursor: pointer; font-weight: 600; transition: all .2s;
  background: transparent; color: var(--text-secondary);
}
.map-view-toggle button.active {
  background: var(--accent); color: #fff; box-shadow: 0 2px 8px var(--accent-glow);
}
.map-view-toggle button:hover:not(.active) { color: var(--text-primary); background: rgba(255,255,255,.06); }
.globe-info-bar {
  display: none; padding: 8px 14px; background: rgba(59,130,246,.1); border-top: 1px solid var(--border);
  font-size: .72rem; color: var(--accent); text-align: center; gap: 8px; align-items: center; justify-content: center;
}
.globe-info-bar.active { display: flex; }
.globe-coords { font-family: 'JetBrains Mono', monospace; }
.leaflet-container { background: var(--bg-primary) !important; }
.map-legend {
  display: flex; gap: 1.5rem; padding: 1rem 1.25rem;
  border-top: 1px solid var(--border); font-size: .75rem; color: var(--text-secondary);
}
.map-legend-item { display: flex; align-items: center; gap: 6px; }
.map-legend-dot { width: 10px; height: 10px; border-radius: 50%; }

/* SAFETY SCORE */
.score-card { grid-column: 2; grid-row: 1; }
.score-display {
  text-align: center; padding: 1.5rem 1.25rem;
}
.score-gauge {
  position: relative; width: 180px; height: 180px; margin: 0 auto 1rem;
}
.score-gauge svg { transform: rotate(-90deg); }
.score-gauge-bg { fill: none; stroke: var(--border); stroke-width: 8; }
.score-gauge-fill {
  fill: none; stroke-width: 8; stroke-linecap: round;
  transition: stroke-dashoffset 1.5s ease, stroke .5s;
}
.score-gauge-value {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center;
}
.score-gauge-value .number {
  font-size: 3rem; font-weight: 900; letter-spacing: -.04em;
  font-family: 'JetBrains Mono', monospace;
}
.score-gauge-value .label {
  font-size: .75rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: .1em; margin-top: 2px;
}
.score-pillars {
  display: flex; flex-direction: column; gap: .75rem;
  padding: 0 1.25rem 1.25rem;
}
.pillar {
  display: flex; align-items: center; gap: .75rem;
  padding: .75rem; background: rgba(255,255,255,.03);
  border-radius: var(--radius); border: 1px solid rgba(255,255,255,.04);
}
.pillar-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.pillar-info { flex: 1; }
.pillar-info .name { font-size: .78rem; font-weight: 500; margin-bottom: 4px; }
.pillar-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.pillar-bar-fill { height: 100%; border-radius: 2px; transition: width 1.2s ease; }
.pillar-score { font-family: 'JetBrains Mono', monospace; font-size: .8rem; font-weight: 600; min-width: 28px; text-align: right; }

/* STATS GRID */
.stats-card { grid-column: 2; grid-row: 2; }
.stats-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: .75rem;
  padding: 1.25rem;
}
.stat-item {
  padding: .85rem; background: rgba(255,255,255,.02);
  border: 1px solid rgba(255,255,255,.04); border-radius: var(--radius);
  text-align: center;
}
.stat-value {
  font-size: 1.5rem; font-weight: 800; font-family: 'JetBrains Mono', monospace;
  margin-bottom: 2px;
}
.stat-label { font-size: .7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; }

/* CHARTS */
.charts-section {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;
}
@media (max-width: 768px) { .charts-section { grid-template-columns: 1fr; } }
.chart-container { position: relative; height: 260px; padding: 1rem 1.25rem; }

/* AD BANNER */
.ad-section {
  grid-column: 1 / -1;
}
.ad-banner {
  background: linear-gradient(135deg, var(--bg-card) 0%, rgba(59,130,246,.08) 100%);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 2rem; display: flex; align-items: center; gap: 2rem;
  transition: border-color .3s;
}
.ad-banner:hover { border-color: var(--accent); }
.ad-banner-icon {
  width: 64px; height: 64px; background: var(--gradient-accent);
  border-radius: var(--radius-lg); display: flex; align-items: center;
  justify-content: center; font-size: 1.8rem; flex-shrink: 0;
  box-shadow: 0 0 30px var(--accent-glow);
}
.ad-banner-content { flex: 1; }
.ad-banner-content h4 { font-size: 1.1rem; font-weight: 700; margin-bottom: .35rem; }
.ad-banner-content p { font-size: .85rem; color: var(--text-secondary); line-height: 1.5; }
.ad-banner-tag {
  font-size: .6rem; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: .1em; margin-bottom: .5rem;
}
.ad-banner .btn { flex-shrink: 0; }

/* AD SIDEBAR CARDS */
.ad-sidebar {
  display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;
}
.ad-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.25rem;
  transition: border-color .3s;
}
.ad-card:hover { border-color: var(--accent); }
.ad-card-tag { font-size: .6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: .75rem; }
.ad-card h5 { font-size: .9rem; font-weight: 600; margin-bottom: .35rem; }
.ad-card p { font-size: .78rem; color: var(--text-secondary); line-height: 1.4; }
.ad-card .btn { margin-top: .75rem; width: 100%; justify-content: center; font-size: .78rem; }

/* LOADING */
.loading-overlay {
  display: none; position: fixed; inset: 0; background: rgba(10,14,26,.85);
  z-index: 200; align-items: center; justify-content: center;
  flex-direction: column; gap: 1.5rem; backdrop-filter: blur(8px);
}
.loading-overlay.active { display: flex; }
.loading-spinner {
  width: 48px; height: 48px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: .9rem; color: var(--text-secondary); }

/* FOOTER */
.footer {
  text-align: center; padding: 2rem; font-size: .75rem;
  color: var(--text-muted); border-top: 1px solid var(--border);
  margin-top: 2rem;
}

/* PDF REPORT (hidden, used for generation) */
#pdf-report {
  position: absolute; left: -9999px; top: 0;
  width: 800px; background: #fff; color: #111; padding: 40px;
  font-family: 'Inter', sans-serif;
}
#pdf-report h1 { font-size: 24px; color: #1a2235; margin-bottom: 4px; }
#pdf-report .pdf-subtitle { font-size: 14px; color: #666; margin-bottom: 24px; }
#pdf-report .pdf-score-box {
  background: linear-gradient(135deg, #1a2235, #2a3550);
  color: #fff; padding: 24px; border-radius: 12px; text-align: center;
  margin-bottom: 24px;
}
#pdf-report .pdf-score-number { font-size: 64px; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
#pdf-report .pdf-score-label { font-size: 14px; opacity: .7; }
#pdf-report .pdf-section { margin-bottom: 20px; }
#pdf-report .pdf-section h3 { font-size: 16px; color: #1a2235; border-bottom: 2px solid #e5e7eb; padding-bottom: 6px; margin-bottom: 12px; }
#pdf-report .pdf-stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
#pdf-report .pdf-stat { background: #f3f4f6; padding: 16px; border-radius: 8px; text-align: center; }
#pdf-report .pdf-stat .val { font-size: 24px; font-weight: 800; color: #1a2235; }
#pdf-report .pdf-stat .lbl { font-size: 11px; color: #666; text-transform: uppercase; }
#pdf-report .pdf-footer { margin-top: 30px; padding-top: 16px; border-top: 1px solid #e5e7eb; font-size: 11px; color: #999; text-align: center; }

/* RESPONSIVE */
@media (max-width: 1024px) {
  .dashboard-grid { grid-template-columns: 1fr; }
  .map-card { grid-column: auto; grid-row: auto; }
  .score-card { grid-column: auto; grid-row: auto; }
  .stats-card { grid-column: auto; grid-row: auto; }
  .ad-card { grid-column: auto; }
}
/* ============================================================
   MOBILE / CELULAR — EXPERIENCIA OTIMIZADA
   ============================================================ */
@media (max-width: 768px) {
  html { -webkit-text-size-adjust: 100%; }
  body { overflow-x: hidden; }
  * { -webkit-tap-highlight-color: rgba(59,130,246,.22); }

  /* HEADER compacto — nao quebra em 3 linhas */
  .header { padding: 0 .7rem; height: 54px; gap: .5rem; }
  .header-brand { font-size: .76rem; letter-spacing: 0; gap: 7px; line-height: 1.1; min-width: 0; }
  .header-brand img { width: 28px !important; height: 28px !important; }
  .header-brand > span:not(.header-badge) {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw;
  }
  .header-badge { font-size: .54rem; padding: 2px 6px; flex-shrink: 0; }
  .header-status { font-size: .6rem; line-height: 1.2; text-align: right; max-width: 32vw; }

  /* BARRA DE IDIOMAS — fixa logo abaixo do header, sempre ao alcance */
  .mobile-lang-bar {
    position: sticky; top: 54px; z-index: 99;
    padding: 7px 8px; gap: 7px;
    background: rgba(17,24,39,.97); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .mobile-lang-bar .mlb-flag { padding: 6px 8px; }
  .mobile-lang-bar .mlb-flag img { width: 26px; height: 18px; }
  .mobile-lang-bar .mlb-flag span { font-size: .62rem; font-weight: 600; }

  /* BRASAO */
  .emblem-section { padding: 1.2rem .75rem 0; }
  .emblem-img { width: 108px !important; height: auto !important; }
  .emblem-title { font-size: .84rem; letter-spacing: .06em; margin-top: .6rem; padding: 0 .3rem; }
  .emblem-tagline { font-size: .76rem; margin-top: .4rem; padding: 0 .3rem; }
  .emblem-subtitle { font-size: .6rem; letter-spacing: .15em; }
  .emblem-divider { width: 90px; margin-top: .7rem; }

  /* ORGAOS INTEGRADOS */
  .agencies-banner { padding: 0 .7rem !important; margin-bottom: 1rem !important; }

  /* BUSCA — a parte mais importante no celular */
  .search-section { padding: 1.4rem .8rem 1.2rem; }
  .search-title { font-size: 1.22rem; line-height: 1.28; margin-bottom: .4rem; }
  .search-subtitle { font-size: .78rem; margin-bottom: 1.1rem; line-height: 1.5; }
  .search-box { flex-direction: column; border-radius: 14px; }
  .search-box input {
    width: 100%; font-size: 16px; padding: 1rem .9rem; text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .search-box button {
    width: 100%; justify-content: center; padding: 1rem;
    font-size: .95rem; min-height: 52px;
  }
  .search-hint { font-size: .68rem; margin-top: .9rem; line-height: 2.1; }
  .search-hint kbd { font-size: .64rem; display: inline-block; margin: 2px 1px; padding: 3px 7px; }

  /* DASHBOARD DE RESULTADOS */
  .main-content { padding: .9rem .65rem 2rem; }
  .result-header { flex-direction: column; gap: .8rem; margin-bottom: 1rem; }
  .result-location h2 { font-size: 1.05rem; line-height: 1.32; word-break: break-word; }
  .result-location p { font-size: .74rem; line-height: 1.55; }
  .result-actions { width: 100%; flex-direction: column; gap: .55rem; }
  .result-actions .btn { width: 100%; justify-content: center; min-height: 48px; font-size: .88rem; }

  .dashboard-grid { gap: 1rem; }
  .card { border-radius: 14px; }

  /* CABECALHO DOS CARDS — controles empilhados e roláveis */
  .card-header { flex-direction: column; align-items: stretch; gap: .6rem; padding: .85rem .9rem; }
  .card-header h3 { font-size: .74rem; letter-spacing: .04em; }
  .map-card .card-header > div {
    width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
    flex-wrap: nowrap !important; scrollbar-width: none; padding-bottom: 2px;
  }
