name: Deploy Portal Update
on:
  workflow_dispatch:
jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download index.html
        run: curl -L "https://customer-assets-m6fa6gv7.emergentagent.net/wingman/dedf7f69-4e6e-48e8-839f-3d2ce1ac8693/attachments/ae7bacfecba648c2a6735957025708dc_index.html" -o index.html
      - name: Download app.js
        run: curl -L "https://customer-assets-m6fa6gv7.emergentagent.net/wingman/dedf7f69-4e6e-48e8-839f-3d2ce1ac8693/attachments/dd3424b8b9534e52869ac1011719514a_app.js" -o app.js
      - name: Download background-check.html
        run: curl -L "https://customer-assets-m6fa6gv7.emergentagent.net/wingman/dedf7f69-4e6e-48e8-839f-3d2ce1ac8693/attachments/be36342bc05a4284b98afbe0dcbc3023_background-check.html" -o background-check.html
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html app.js background-check.html
          git commit -m "feat: add map search and GPS features (update by engineer)" || echo "No changes to commit"
          git push