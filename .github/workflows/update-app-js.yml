name: Update app.js
on:
  workflow_dispatch:
jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download updated file
        run: |
          curl -o app.js https://customer-assets-m6fa6gv7.emergentagent.net/wingman/dedf7f69-4e6e-48e8-839f-3d2ce1ac8693/attachments/4b6b3e44ce714b32b0d70fb842ee1361_app_updated.js
      - name: Commit and push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add app.js
          git commit -m "chore: update app.js via background agent workflow"
          git push