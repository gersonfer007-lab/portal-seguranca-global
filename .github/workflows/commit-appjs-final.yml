name: Commit PSG v2.0 app.js Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download app.js final
        run: |
          curl -L "https://customer-assets-m6fa6gv7.emergentagent.net/wingman/dedf7f69-4e6e-48e8-839f-3d2ce1ac8693/attachments/4fef5993618642b7938619d40cef1a44_app.js" -o app.js
          echo "Downloaded app.js size: $(wc -c < app.js) bytes"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet || git commit -m "feat: PSG v2.0 - connect app.js to Render backend (portal-seguranca-global.onrender.com)"
          git push
