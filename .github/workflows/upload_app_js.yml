name: Upload Large app.js
on:
  push:
    paths:
      - '.github/workflows/upload_app_js.yml'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download app.js
        run: |
          curl -L "https://customer-assets-m6fa6gv7.emergentagent.net/wingman/dedf7f69-4e6e-48e8-839f-3d2ce1ac8693/attachments/37c8f9068dd045ff9b6a2a884d238c6c_app.js" -o app.js
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "feat: update app.js via GitHub Action [automated]" || echo "No changes"
          git push
