<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Descadastro · Portal Segurança Global</title>
<meta name="robots" content="noindex" />
<style>
:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #111827;
  --bg-card: #1a2235;
  --border: #2a3550;
  --text-primary: #e8ecf4;
  --text-secondary: #8b95a8;
  --text-muted: #5a6478;
  --accent: #3b82f6;
  --gradient-accent: linear-gradient(135deg, #3b82f6, #6366f1);
  --gradient-safe: linear-gradient(135deg, #22c55e, #10b981);
  --shadow-lg: 0 8px 40px rgba(0,0,0,.5);
  --radius: 12px;
  --radius-lg: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; -webkit-font-smoothing: antialiased; }
body {
  display: flex; align-items: center; justify-content: center; padding: 24px;
  background:
    radial-gradient(900px 500px at 80% -10%, rgba(59,130,246,.12), transparent 60%),
    radial-gradient(700px 400px at 0% 110%, rgba(34,197,94,.08), transparent 55%),
    var(--bg-primary);
}
.card {
  width: 100%; max-width: 520px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); padding: 36px 32px; text-align: center;
}
.logo {
  width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 14px;
  background: var(--gradient-accent);
  display: flex; align-items: center; justify-content: center;
}
.logo svg { width: 28px; height: 28px; color: #fff; }
h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -.01em; }
.sub { color: var(--text-secondary); font-size: .92rem; line-height: 1.6; margin: 12px 0 26px; }
.sub b { color: var(--text-primary); }

form { text-align: left; }
label { display: block; font-size: .82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
input[type=email] {
  width: 100%; background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text-primary); padding: .85rem 1rem; font-size: .95rem; font-family: inherit; outline: none;
  transition: border-color .15s;
}
input[type=email]:focus { border-color: var(--accent); }
button {
  width: 100%; margin-top: 14px; padding: .9rem 1rem; border: none; border-radius: 10px;
  background: var(--gradient-safe); color: #fff; font-size: .95rem; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: opacity .15s, transform .1s;
}
button:hover { opacity: .92; }
button:active { transform: scale(.99); }
button:disabled { opacity: .5; cursor: wait; }

.result { display: none; margin-top: 26px; padding: 18px 20px; border-radius: 12px; text-align: left; font-size: .92rem; line-height: 1.6; }
.result.ok { display: block; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.35); color: #86efac; }
.result.err { display: block; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.35); color: #fca5a5; }
.result b { color: #fff; }

.foot { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: .78rem; line-height: 1.6; }
.foot a { color: var(--accent); text-decoration: none; }
.note { margin-top: 10px; color: var(--text-muted); font-size: .74rem; line-height: 1.5; }
</style>
</head>
<body>
<main class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
  </div>
  <h1>Descadastro de e-mails</h1>
  <p class="sub">
    Informe o endereço que deseja remover da lista. Você <b>não receberá mais nenhuma mensagem</b> nossa após a solicitação.
  </p>

  <form id="form" action="https://formsubmit.co/contato@portalsegurancaglobal.com.br" method="POST" autocomplete="on">
    <input type="hidden" name="_subject" value="Pedido de descadastro — Portal Segurança Global" />
    <input type="hidden" name="_template" value="table" />
    <input type="hidden" name="_captcha" value="false" />
    <input type="hidden" name="_next" value="https://portalsegurancaglobal.com.br/descadastro.html?enviado=1" />
    <input type="hidden" name="pedido" value="DESCADASTRO" />
    <label for="email">Seu e-mail</label>
    <input type="email" id="email" name="email" required placeholder="seu@email.com" />
    <button type="submit" id="btn">Solicitar descadastro</button>
  </form>

  <div id="result" class="result"></div>

  <div class="foot">
    Portal Segurança Global · <a href="https://portalsegurancaglobal.com.br">portalsegurancaglobal.com.br</a>
    <p class="note">Seu pedido é processado com privacidade. Nenhum dado da lista de contatos é exibido nesta página.</p>
  </div>
</main>

<script>
(function () {
  var form = document.getElementById('form');
  var input = document.getElementById('email');
  var btn = document.getElementById('btn');
  var result = document.getElementById('result');

  // preenche automaticamente quando o link do e-mail traz ?email=...
  try {
    var q = new URLSearchParams(location.search).get('email');
    if (q && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(q)) input.value = q;
  } catch (e) {}

  if (new URLSearchParams(location.search).get('enviado') === '1') {
    form.style.display = 'none';
    result.className = 'result ok';
    result.innerHTML = '<b>Pedido recebido!</b><br>O pedido de descadastro foi encaminhado. O endereço será removido da nossa lista em até 48 horas úteis.';
  }

  form.addEventListener('submit', function (event) {
    var email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      event.preventDefault();
      result.className = 'result err';
      result.innerHTML = '<b>E-mail inválido.</b> Verifique o endereço e tente novamente.';
      return;
    }

    // O envio segue pelo POST HTML nativo para o FormSubmit.
    // Assim não depende de fetch/CORS e o FormSubmit redireciona para _next.
    btn.disabled = true;
    btn.textContent = 'Enviando…';
  });
})();
</script>
</body>
</html>
